name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install example tools and Chromium
        run: |
          npm ci --prefix examples --registry=https://registry.npmjs.org/ --@kaspacom:registry=https://registry.npmjs.org/
          npm exec --prefix examples -- playwright install --with-deps --only-shell chromium
      - name: Test packed package in Node and browser
        run: npm run test:examples
      - name: Verify dynamic priority fees across trading and claims
        run: npm run test:network-fee:matrix
      - name: Verify public integration documentation
        run: npm run build && node scripts/verify-public-docs.mjs
      - name: Verify snapshot transactions with pinned WASM
        run: npm run test:snapshot:transactions
        env:
          SNAPSHOT_TEST_WASM: ${{ github.workspace }}/examples/vendor/kaspa
      - name: Verify KCOM vesting transactions with pinned WASM
        run: npm run test:kcom-vesting
        env:
          SNAPSHOT_TEST_WASM: ${{ github.workspace }}/examples/vendor/kaspa
      - name: Verify KCOM claim vault and activation with pinned WASM
        run: npm run test:kcom-claim-fund
        env:
          SNAPSHOT_TEST_WASM: ${{ github.workspace }}/examples/vendor/kaspa

      - name: Verify configurable KCOM schedules and fast campaign builders
        run: npm run test:kcom-configurable
        env:
          SNAPSHOT_TEST_WASM: ${{ github.workspace }}/examples/vendor/kaspa

  consolidation-consensus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Execute signed consolidation transactions against pinned consensus
        run: npm run test:consolidation:consensus
        env:
          CONSOLIDATION_EVIDENCE: ${{ runner.temp }}/kcc20-consensus-evidence
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_INCREMENTAL: 0
      - name: Retain signed consensus fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-consensus-${{ github.sha }}
          path: ${{ runner.temp }}/kcc20-consensus-evidence
          if-no-files-found: error
          retention-days: 14
